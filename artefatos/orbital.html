<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITAL — generative gravity sandbox</title>
<style>
  :root { --bg: #03040a; --ink: #e8ecf4; --muted: #6b7385; --accent: #7dd3fc; --warm: #fbbf24; --pink: #f472b6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    cursor: crosshair;
  }
  canvas { position: fixed; inset: 0; z-index: 0; }

  .hud {
    position: fixed; z-index: 10; pointer-events: none;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  .hud .top {
    position: absolute; top: 28px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .hud .title {
    font-size: 26px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud .sub { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  .hud .stats { text-align: right; font-variant-numeric: tabular-nums; }
  .hud .stats .big { font-size: 22px; font-weight: 700; }
  .hud .stats .small { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  .hud .bottom {
    position: absolute; bottom: 28px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: auto;
  }
  .hud .hint {
    font-size: 12px; color: var(--muted); line-height: 1.7;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px; border-radius: 12px; backdrop-filter: blur(10px);
    max-width: 320px;
  }
  .hud .hint b { color: var(--ink); }
  .hud .controls {
    display: flex; gap: 8px;
  }
  .hud button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: var(--ink); padding: 10px 16px; border-radius: 10px;
    font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px);
    transition: all .2s ease; letter-spacing: .5px;
  }
  .hud button:hover { background: rgba(125,211,252,0.15); border-color: var(--accent); transform: translateY(-1px); }
  .hud button.active { background: var(--accent); color: #03040a; border-color: var(--accent); }

  .center-cross {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 40px; height: 40px; pointer-events: none;
  }
  .center-cross::before, .center-cross::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.15);
  }
  .center-cross::before { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }
  .center-cross::after { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }

  .flash {
    position: fixed; inset: 0; background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.4), transparent 40%);
    pointer-events: none; z-index: 5; opacity: 0; transition: opacity .6s ease;
  }
  .flash.show { opacity: 1; transition: opacity .1s ease; }

  .legend {
    position: absolute; top: 80px; right: 32px; font-size: 11px; color: var(--muted);
    text-align: right; line-height: 1.8;
  }
  .legend span { display: block; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>

  <canvas id="c"></canvas>
  <div class="flash" id="flash"></div>

  <div class="hud">
    <div class="top">
      <div>
        <div class="title">ORBITAL</div>
        <div class="sub">generative gravity sandbox</div>
      </div>
      <div class="stats">
        <div class="big" id="bodyCount">0</div>
        <div class="small">BODIES</div>
        <div class="small" style="margin-top:6px;" id="fps">-- fps</div>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#7dd3fc"></span>planet</span>
      <span><span class="dot" style="background:#fbbf24"></span>star</span>
      <span><span class="dot" style="background:#f472b6"></span>comet</span>
    </div>
    <div class="center-cross"></div>
    <div class="bottom">
      <div class="hint">
        <b>Click</b> to spawn a body · <b>Drag</b> to launch with velocity · <b>Right-click</b> to place a star (gravity well) · <b>Scroll</b> to zoom<br>
        <b>Space</b> pause · <b>C</b> clear · <b>T</b> trails
      </div>
      <div class="controls">
        <button id="pauseBtn">Pause</button>
        <button id="trailsBtn" class="active">Trails</button>
        <button id="clearBtn">Clear</button>
        <button id="starBtn">+ Star</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); window.addEventListener('resize', resize);

// state
let bodies = [];
let trails = [];
let paused = false;
let showTrails = true;
let zoom = 1;
let camX = 0, camY = 0;
let dragging = null; // {body, startX, startY, startT}
let mouse = {x:0,y:0};
let lastFrame = performance.now();
let fps = 60;
const G = 0.5;

// starfield background
const stars = [];
for (let i=0;i<400;i++) stars.push({
  x: Math.random(), y: Math.random(),
  r: Math.random()*1.2+0.2, tw: Math.random()*Math.PI*2, sp: Math.random()*0.02+0.005
});

function worldToScreen(x,y){ return {x: (x-camX)*zoom + W/2, y: (y-camY)*zoom + H/2}; }
function screenToWorld(x,y){ return {x: (x-W/2)/zoom + camX, y: (y-H/2)/zoom + camY}; }

function spawnBody(x,y,vx=0,vy=0,mass=1,type='planet') {
  const colors = {
    planet: ['#7dd3fc','#a78bfa','#5eead4','#fbbf24'],
    star: ['#fbbf24','#fde68a','#fff'],
    comet: ['#f472b6','#fb7185','#fda4af']
  };
  const c = colors[type][Math.floor(Math.random()*colors[type].length)];
  bodies.push({ x, y, vx, vy, mass, type, color: c, r: type==='star'? 8+mass*2 : 3+mass*1.5, age:0, trail:[] });
}

// initial: one central star
spawnBody(0,0,0,0,8,'star');

function step(dt) {
  if (paused) return;
  // gravity
  for (let i=0;i<bodies.length;i++){
    const a = bodies[i];
    let fx=0, fy=0;
    for (let j=0;j<bodies.length;j++){
      if (i===j) continue;
      const b = bodies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx*dx+dy*dy;
      const d = Math.sqrt(d2);
      if (d < 1) continue;
      const force = G * a.mass * b.mass / d2;
      fx += force * dx/d;
      fy += force * dy/d;
      // collision merge
      if (d < (a.r+b.r)*0.6 && a.mass!==b.mass) {
        // merge smaller into larger
        if (a.mass < b.mass) { /* handled below */ }
      }
    }
    a.vx += fx/a.mass * dt;
    a.vy += fy/a.mass * dt;
  }
  // integrate + collisions
  const toRemove = new Set();
  for (let i=0;i<bodies.length;i++){
    const a = bodies[i];
    a.x += a.vx*dt; a.y += a.vy*dt;
    a.age += dt;
    if (showTrails) {
      a.trail.push({x:a.x,y:a.y});
      if (a.trail.length > 60) a.trail.shift();
    } else a.trail = [];
    // collision
    for (let j=i+1;j<bodies.length;j++){
      const b = bodies[j];
      const dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
      if (d < a.r+b.r) {
        // merge
        const totalMass = a.mass+b.mass;
        a.x = (a.x*a.mass + b.x*b.mass)/totalMass;
        a.y = (a.y*a.mass + b.y*b.mass)/totalMass;
        a.vx = (a.vx*a.mass + b.vx*b.mass)/totalMass;
        a.vy = (a.vy*a.mass + b.vy*b.mass)/totalMass;
        a.mass = totalMass;
        a.r = a.type==='star' ? 8+a.mass*2 : 3+a.mass*1.5;
        a.color = a.mass > b.mass ? a.color : b.color;
        toRemove.add(j);
        // flash
        const sp = worldToScreen(a.x,a.y);
        flashAt(sp.x, sp.y);
      }
    }
  }
  // remove merged (reverse order)
  const arr = [...toRemove].sort((a,b)=>b-a);
  arr.forEach(i => bodies.splice(i,1));
  // bounds: remove if too far
  bodies = bodies.filter(b => Math.hypot(b.x,b.y) < 2000);
}

function flashAt(x,y){
  const f = document.getElementById('flash');
  f.style.setProperty('--x', x+'px');
  f.style.setProperty('--y', y+'px');
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 120);
}

function draw() {
  // background
  ctx.fillStyle = 'rgba(3,4,10,0.18)';
  ctx.fillRect(0,0,W,H);

  // starfield (parallax)
  ctx.save();
  stars.forEach(s => {
    const px = (s.x*W + camX*0.05) % W;
    const py = (s.y*H + camY*0.05) % H;
    const tw = 0.5 + 0.5*Math.sin(performance.now()*s.sp + s.tw);
    ctx.globalAlpha = s.r*0.4*tw;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // trails
  if (showTrails) {
    bodies.forEach(b => {
      if (b.trail.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = 0.35;
      const p0 = worldToScreen(b.trail[0].x,b.trail[0].y);
      ctx.moveTo(p0.x,p0.y);
      for (let i=1;i<b.trail.length;i++){
        const p = worldToScreen(b.trail[i].x,b.trail[i].y);
        ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  // bodies
  bodies.forEach(b => {
    const p = worldToScreen(b.x,b.y);
    // glow
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,b.r*4);
    g.addColorStop(0, b.color+'cc');
    g.addColorStop(1, b.color+'00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r*4,0,Math.PI*2); ctx.fill();
    // core
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r,0,Math.PI*2); ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(p.x-b.r*0.3, p.y-b.r*0.3, b.r*0.3,0,Math.PI*2); ctx.fill();
  });

  // dragging preview
  if (dragging) {
    const p = worldToScreen(dragging.x, dragging.y);
    ctx.strokeStyle = 'rgba(125,211,252,0.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
    ctx.setLineDash([]);
    // velocity arrow
    const dx = mouse.x - p.x, dy = mouse.y - p.y;
    ctx.fillStyle = 'rgba(125,211,252,0.8)';
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI*2); ctx.fill();
  }

  // HUD update
  document.getElementById('bodyCount').textContent = bodies.length;
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now-lastT)/1000);
  lastT = now;
  // fps
  const inst = 1000/(now-lastFrame); lastFrame=now;
  fps = fps*0.9 + inst*0.1;
  document.getElementById('fps').textContent = Math.round(fps)+' fps';
  if (!paused) step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// interactions
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    // right click -> star
    e.preventDefault();
    const w = screenToWorld(e.clientX, e.clientY);
    spawnBody(w.x, w.y, 0, 0, 12, 'star');
    flashAt(e.clientX, e.clientY);
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);
  // check if clicking existing body
  let hit = null;
  for (const b of bodies) {
    const p = worldToScreen(b.x,b.y);
    if (Math.hypot(p.x-e.clientX, p.y-e.clientY) < b.r*zoom+6) { hit = b; break; }
  }
  if (hit) {
    dragging = { body: hit, x: hit.x, y: hit.y, startX: e.clientX, startY: e.clientY };
  } else {
    const nb = { x: w.x, y: w.y, vx:0, vy:0, mass: 1+Math.random()*2, type: Math.random()<0.15?'comet':'planet', color:'', r:0, age:0, trail:[] };
    const colors = { planet:['#7dd3fc','#a78bfa','#5eead4','#fbbf24'], comet:['#f472b6','#fb7185','#fda4af'] };
    nb.color = colors[nb.type][Math.floor(Math.random()*colors[nb.type].length)];
    nb.r = 3+nb.mass*1.5;
    bodies.push(nb);
    dragging = { body: nb, x: nb.x, y: nb.y, startX: e.clientX, startY: e.clientY };
  }
});
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (dragging) {
    // nothing extra; preview uses mouse
  }
});
canvas.addEventListener('mouseup', (e) => {
  if (dragging) {
    const dx = (e.clientX - dragging.startX)/zoom;
    const dy = (e.clientY - dragging.startY)/zoom;
    dragging.body.vx = -dx*0.05;
    dragging.body.vy = -dy*0.05;
    dragging = null;
  }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.12 : 0.88;
  zoom = Math.max(0.3, Math.min(4, zoom));
}, { passive: false });

// keyboard
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { paused = !paused; document.getElementById('pauseBtn').classList.toggle('active', paused); document.getElementById('pauseBtn').textContent = paused?'Resume':'Pause'; }
  if (e.key === 'c' || e.key === 'C') { bodies = bodies.filter(b=>b.type==='star' && b.mass>5); }
  if (e.key === 't' || e.key === 'T') { showTrails = !showTrails; document.getElementById('trailsBtn').classList.toggle('active', showTrails); }
});

document.getElementById('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  const b = document.getElementById('pauseBtn');
  b.classList.toggle('active', paused);
  b.textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('trailsBtn').addEventListener('click', () => {
  showTrails = !showTrails;
  document.getElementById('trailsBtn').classList.toggle('active', showTrails);
});
document.getElementById('clearBtn').addEventListener('click', () => {
  bodies = bodies.filter(b => b.type==='star' && b.mass>5);
});
document.getElementById('starBtn').addEventListener('click', () => {
  spawnBody(0,0,0,0,12,'star');
});
</script>
</body>
</html>
