<!doctype html><html><head><meta charset="utf-8"><title>fx-demo</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c" width="1800" height="2400"></canvas>
<script src="../runtime/lab.js"></script><script src="../runtime/fx.js"></script>
<script>
// Test card: a source image drawn procedurally (no files), then every FX pass on a tile of it.
const TW = 300, TH = 400, COLS = 6;
const fx = FX.create(TW, TH);
const src = document.createElement('canvas'); src.width = TW; src.height = TH; const s = src.getContext('2d');
function drawSource(t) {
  const g = s.createLinearGradient(0, 0, 0, TH); g.addColorStop(0, '#16224a'); g.addColorStop(.55, '#6a3fb0'); g.addColorStop(1, '#ff8a5a'); s.fillStyle = g; s.fillRect(0, 0, TW, TH);
  s.fillStyle = '#fff4d6'; s.beginPath(); s.arc(210, 120, 46, 0, 7); s.fill();                       // sun (bright: bloom target)
  s.fillStyle = '#0b0b14'; s.beginPath(); s.moveTo(0, 330); for (let x = 0; x <= TW; x += 20) s.lineTo(x, 300 + 30 * Math.sin(x * .05 + 1) + 20 * Math.sin(x * .11)); s.lineTo(TW, TH); s.lineTo(0, TH); s.fill();
  s.fillStyle = '#ffffff'; s.font = '900 84px sans-serif'; s.textAlign = 'center'; s.fillText('Aa', 110, 230);
  s.strokeStyle = '#3dff7a'; s.lineWidth = 5; s.strokeRect(30, 40, 90, 60);
  s.fillStyle = '#ff3b6b'; s.fillRect(30, 260, 60, 14);
}
const out = document.getElementById('c'), o = out.getContext('2d');
const tests = [
  ['source', []], ['bloom', [{ pass: 'bloom', intensity: 1.2 }]], ['glow', [{ pass: 'glow' }]], ['chromatic', [{ pass: 'chromatic', amount: .012 }]], ['grain', [{ pass: 'grain', amount: .25 }]], ['vignette', [{ pass: 'vignette', amount: .8 }]],
  ['halftone dots', [{ pass: 'halftone', size: 7 }]], ['halftone lines', [{ pass: 'halftone', mode: 1, size: 6 }]], ['halftone cmyk', [{ pass: 'halftone', mode: 2, size: 7 }]], ['duotone', [{ pass: 'duotone' }]], ['tritone', [{ pass: 'tritone' }]], ['posterize', [{ pass: 'posterize', levels: 4 }]],
  ['grade warm', [{ pass: 'grade', temperature: 1, contrast: 1.15, saturation: 1.2 }]], ['filmic', [{ pass: 'filmic', exposure: 1.3 }]], ['scanlines', [{ pass: 'scanlines', strength: .35 }]], ['crt', [{ pass: 'crt' }]], ['lens', [{ pass: 'lens', distortion: .35 }]], ['blur', [{ pass: 'blur', radius: 6 }]],
  ['dirblur', [{ pass: 'dirblur', radius: 40, angle: .3 }]], ['radialBlur', [{ pass: 'radialBlur', amount: .25 }]], ['tiltshift', [{ pass: 'tiltshift' }]], ['pixelate', [{ pass: 'pixelate', size: 12 }]], ['displace', [{ pass: 'displace', amount: .03 }]], ['ripple', [{ pass: 'ripple', start: 0, amp: .03 }]],
  ['glitch', [{ pass: 'glitch', amount: .8 }]], ['kaleido', [{ pass: 'kaleido' }]], ['mirror', [{ pass: 'mirror' }]], ['lightleak', [{ pass: 'lightleak', strength: .8 }]], ['dust', [{ pass: 'dust', density: 1 }]], ['paperTexture', [{ pass: 'paperTexture', strength: .6 }]],
  ['sharpen', [{ pass: 'sharpen', amount: 1 }]], ['edge', [{ pass: 'edge' }]], ['invert', [{ pass: 'invert' }]], ['colorize', [{ pass: 'colorize' }]], ['chain neonBloom', FX.chains.neonBloom()], ['chain riso', FX.chains.riso()], ['chain vhs', FX.chains.vhs({ glitch: .3 })]
];
function render(t) {
  drawSource(t); o.fillStyle = '#222'; o.fillRect(0, 0, 1800, 2400);
  tests.forEach((tc, i) => {
    const x = (i % COLS) * TW, y = Math.floor(i / COLS) * TH; let img = src;
    if (tc[1].length) { fx.apply(src, tc[1], 0.5 + t); img = fx.canvas; }
    o.drawImage(img, x, y); o.fillStyle = 'rgba(0,0,0,.65)'; o.fillRect(x, y, 140, 18); o.fillStyle = '#fff'; o.font = '12px monospace'; o.textAlign = 'left'; o.fillText(tc[0], x + 4, y + 13);
  });
}
Lab.init({ w: 1800, h: 2400, duration: 2, fps: 30, bg: '#222', render });
</script></body></html>
